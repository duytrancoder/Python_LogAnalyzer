name: CD Release to GHCR

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"

jobs:
  test:
    name: Quality Gate & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code formatting and linting with Ruff
        run: |
          ruff check .

      - name: Run Pytest with coverage gate
        run: |
          pytest --cov=log_analyzer --cov-report=term-missing

      - name: Verify CI Quality Gate (Threshold Failure Exit Code 2)
        run: |
          set +e
          python log_analyzer.py sample.log --max-errors 1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 2 ]; then
            echo "Expected exit code 2 when errors exceed threshold, got $EXIT_CODE"
            exit 1
          fi
          echo "Quality Gate verified before release."

  build-and-publish:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
