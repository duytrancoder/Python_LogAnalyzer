name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate Python Log Analyzer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run automated unit tests
        run: |
          python -m unittest test_log_analyzer.py -v

      - name: Test CLI execution with sample log
        run: |
          python log_analyzer.py sample.log --output report.json
          python -c "import json; data = json.load(open('report.json')); assert data['counts']['ERROR'] == 2; assert data['malformed_lines'] == 1"

      - name: Verify CI Quality Gate (Threshold Failure Exit Code 2)
        run: |
          set +e
          python log_analyzer.py sample.log --max-errors 1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 2 ]; then
            echo "Expected exit code 2 when errors exceed threshold, got $EXIT_CODE"
            exit 1
          fi
          echo "Quality Gate verified: Exit code 2 returned successfully as expected."
